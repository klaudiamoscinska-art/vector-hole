<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 800"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>
  <linearGradient id="bgGradient" x1="200" y1="0" x2="200" y2="800" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#04101D"/>
    <stop offset="50%" stop-color="#061725"/>
    <stop offset="100%" stop-color="#081C2B"/>
  </linearGradient>
  <linearGradient id="panelGradient" x1="200" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0A2032"/>
    <stop offset="100%" stop-color="#071725"/>
  </linearGradient>
  <linearGradient id="ctaGradient" x1="16" y1="0" x2="384" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#68F5FC"/>
    <stop offset="55%" stop-color="#50F0FA"/>
    <stop offset="100%" stop-color="#37DCEB"/>
  </linearGradient>
  <filter id="glowCyanStrong" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowYellow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="0" y="0" width="400" height="800" fill="url(#bgGradient)"/>

<!-- HEADER -->
<g id="header">
  <text x="200" y="46" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#819BB1" text-anchor="middle">KONIEC RUNDY</text>
</g>

<!-- SCORE HERO -->
<g id="score-hero">
  <text x="200" y="150" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#9DB1C2" text-anchor="middle">WYNIK</text>
  <text x="200" y="205" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#50F0FA" text-anchor="middle" filter="url(#glowCyanStrong)">4 280</text>
  <text x="200" y="205" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#F5FAFF" text-anchor="middle">4 280</text>

  <!-- new PB badge -->
  <g transform="translate(280,178)">
    <rect x="-32" y="-11" width="64" height="22" rx="11" fill="#0B2A3C" stroke="#EFCB63" stroke-width="1.1"/>
    <text x="0" y="4" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="700" fill="#EFCB63" text-anchor="middle">NOWY PB</text>
  </g>
</g>

<!-- TIER / PLACE -->
<g id="tier-place">
  <g id="tier-badge" transform="translate(130,250)">
    <rect x="-60" y="-24" width="120" height="48" rx="10" fill="url(#panelGradient)" stroke="#315A72" stroke-width="0.9"/>
    <text x="0" y="-6" font-family="Arial, Helvetica, sans-serif" font-size="7.4" font-weight="700" fill="#819BB1" text-anchor="middle">ROZMIAR / TIER</text>
    <text x="0" y="14" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#F5FAFF" text-anchor="middle">T4 · DUŻY</text>
  </g>

  <g id="place-badge" transform="translate(270,250)">
    <rect x="-60" y="-24" width="120" height="48" rx="10" fill="url(#panelGradient)" stroke="#315A72" stroke-width="0.9"/>
    <text x="0" y="-6" font-family="Arial, Helvetica, sans-serif" font-size="7.4" font-weight="700" fill="#819BB1" text-anchor="middle">MIEJSCE</text>
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#EFCB63" text-anchor="middle">#1</text>
  </g>
</g>

<!-- COINS EARNED -->
<g id="coins-earned">
  <rect x="16" y="300" width="368" height="60" rx="11" fill="url(#panelGradient)" stroke="#315A72" stroke-width="0.9"/>
  <g transform="translate(48,330)">
    <ellipse cx="0" cy="4" rx="10" ry="4.2" fill="none" stroke="#EFCB63" stroke-width="1.6" filter="url(#glowYellow)"/>
    <ellipse cx="0" cy="0" rx="10" ry="4.2" fill="#0B2434" stroke="#EFCB63" stroke-width="1.6"/>
    <ellipse cx="0" cy="0" rx="5.5" ry="2" fill="none" stroke="#FFE077" stroke-width="0.8"/>
  </g>
  <text x="78" y="325" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#819BB1">ZDOBYTE MONETY</text>
  <text x="78" y="342" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#EFCB63">+62 monety</text>
</g>

<!-- CORE CITY PROGRESS -->
<g id="core-city-progress">
  <rect x="16" y="372" width="368" height="94" rx="11" fill="url(#panelGradient)" stroke="#315A72" stroke-width="0.9"/>
  <text x="32" y="394" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" letter-spacing="0.3" fill="#C6D5E3">POSTĘP CORE CITY</text>

  <text x="32" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#50F0FA">76%</text>
  <text x="55" y="424" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#819BB1"> → </text>
  <text x="72" y="424" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#F5FAFF">84%</text>
  <text x="140" y="424" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#46D99A">+8%</text>

  <rect x="32" y="436" width="336" height="8" rx="4" fill="#0B2434" stroke="#24475C" stroke-width="0.6"/>
  <rect x="32" y="436" width="255" height="8" rx="4" fill="#36546B"/>
  <rect x="32" y="436" width="282" height="8" rx="4" fill="#50F0FA"/>
</g>

<!-- PRIMARY CTA -->
<g id="cta-replay">
  <rect x="16" y="486" width="368" height="48" rx="10" fill="url(#ctaGradient)"/>
  <text x="200" y="516" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="800" fill="#07131E" text-anchor="middle">ZAGRAJ JESZCZE RAZ</text>
</g>

<!-- REWARDED AD -->
<g id="cta-rewarded-ad">
  <rect x="16" y="544" width="368" height="44" rx="10" fill="#071827" stroke="#EFCB63" stroke-width="1.1"/>
  <g transform="translate(46,566)" stroke="#EFCB63" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="-6,-7 6,0 -6,7"/>
  </g>
  <text x="200" y="570" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#EFCB63" text-anchor="middle">OGLĄDAJ REKLAMĘ · X2 MONET</text>
</g>

<!-- BACK LINK -->
<g id="back-to-city">
  <text x="200" y="618" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" fill="#819BB1" text-anchor="middle">Wróć do Miasta</text>
</g>

</svg>
