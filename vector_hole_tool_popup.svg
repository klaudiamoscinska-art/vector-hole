<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 800"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>
  <linearGradient id="bgGradient" x1="200" y1="0" x2="200" y2="800" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#04101D"/>
    <stop offset="100%" stop-color="#081C2B"/>
  </linearGradient>
  <linearGradient id="panelGradient" x1="200" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0A2032"/>
    <stop offset="100%" stop-color="#071725"/>
  </linearGradient>
  <linearGradient id="ctaGradient" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#68F5FC"/>
    <stop offset="55%" stop-color="#50F0FA"/>
    <stop offset="100%" stop-color="#37DCEB"/>
  </linearGradient>
</defs>

<g id="gameplay-background" opacity="0.35">
  <rect x="0" y="0" width="400" height="800" fill="url(#bgGradient)"/>
  <circle cx="200" cy="260" r="70" fill="none" stroke="#2BCBDD" stroke-width="1"/>
</g>

<rect id="scrim" x="0" y="0" width="400" height="800" fill="#04101D" opacity="0.72"/>

<!-- POPUP PANEL -->
<g id="tool-popup">
  <rect x="24" y="200" width="352" height="420" rx="16" fill="url(#panelGradient)" stroke="#315A72" stroke-width="1.1"/>

  <text x="200" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#F5FAFF" text-anchor="middle">WYBIERZ NARZĘDZIE</text>
  <text x="200" y="256" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#819BB1" text-anchor="middle">Rozgrywka zatrzymana</text>

  <!-- Tool card 1 -->
  <g id="tool-card-1" transform="translate(48,278)">
    <rect width="304" height="72" rx="11" fill="#071827" stroke="#50F0FA" stroke-width="1.2"/>
    <circle cx="36" cy="36" r="17" fill="none" stroke="#50F0FA" stroke-width="1.4"/>
    <path d="M 30 36 Q 36 26 42 36" stroke="#50F0FA" stroke-width="1.4" fill="none"/>
    <text x="66" y="30" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F5FAFF">Trail Impuls</text>
    <text x="66" y="45" font-family="Arial, Helvetica, sans-serif" font-size="7.6" fill="#9DB1C2">Zostawia energetyczny ślad za rdzeniem.</text>
    <circle cx="278" cy="36" r="9" fill="#0B2A3C" stroke="#50F0FA" stroke-width="1.2"/>
    <circle cx="278" cy="36" r="3.4" fill="#50F0FA"/>
  </g>

  <!-- Tool card 2 -->
  <g id="tool-card-2" transform="translate(48,362)">
    <rect width="304" height="72" rx="11" fill="#071827" stroke="#24475C" stroke-width="0.9"/>
    <circle cx="36" cy="36" r="17" fill="none" stroke="#EFCB63" stroke-width="1.4"/>
    <path d="M 27 32 L 36 24 L 45 32 L 45 44 L 27 44 Z" fill="none" stroke="#EFCB63" stroke-width="1.2"/>
    <text x="66" y="30" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F5FAFF">Pixel Burst</text>
    <text x="66" y="45" font-family="Arial, Helvetica, sans-serif" font-size="7.6" fill="#9DB1C2">Efekt pochłaniania z rozpryskiem pikseli.</text>
    <circle cx="278" cy="36" r="9" fill="#0A1C2B" stroke="#819BB1" stroke-width="1.2"/>
  </g>

  <!-- Tool card 3 -->
  <g id="tool-card-3" transform="translate(48,446)">
    <rect width="304" height="72" rx="11" fill="#071827" stroke="#24475C" stroke-width="0.9"/>
    <circle cx="36" cy="36" r="17" fill="none" stroke="#9875FF" stroke-width="1.4"/>
    <path d="M 27 42 L 36 24 L 45 42 Z" fill="none" stroke="#9875FF" stroke-width="1.2"/>
    <text x="66" y="30" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#F5FAFF">Fala Overdrive</text>
    <text x="66" y="45" font-family="Arial, Helvetica, sans-serif" font-size="7.6" fill="#9DB1C2">Silny impuls w finałowej fazie rundy.</text>
    <circle cx="278" cy="36" r="9" fill="#0A1C2B" stroke="#819BB1" stroke-width="1.2"/>
  </g>

  <!-- CTA row -->
  <g id="popup-cta-row">
    <g transform="translate(48,542)">
      <rect width="152" height="46" rx="10" fill="url(#ctaGradient)"/>
      <text x="76" y="29" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#07131E" text-anchor="middle">WYBIERZ</text>
    </g>
    <g transform="translate(200,542)">
      <rect width="152" height="46" rx="10" fill="#071827" stroke="#315A72" stroke-width="1"/>
      <text x="76" y="29" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#C6D5E3" text-anchor="middle">ZAMKNIJ</text>
    </g>
  </g>
</g>

</svg>
