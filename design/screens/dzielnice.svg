<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 800"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>
  <linearGradient id="bgGradient" x1="200" y1="0" x2="200" y2="800" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#04101D"/>
    <stop offset="50%" stop-color="#061725"/>
    <stop offset="100%" stop-color="#081C2B"/>
  </linearGradient>
  <linearGradient id="panelGradient" x1="200" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0A2032"/>
    <stop offset="100%" stop-color="#071725"/>
  </linearGradient>
  <linearGradient id="activeCardGradient" x1="16" y1="0" x2="384" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0B2A3C"/>
    <stop offset="100%" stop-color="#0A2032"/>
  </linearGradient>
  <filter id="glowCyanSoft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<g id="screen-background">
  <rect x="0" y="0" width="400" height="800" fill="url(#bgGradient)"/>
</g>

<!-- HEADER -->
<g id="header">
  <text x="18" y="25" font-family="Arial, Helvetica, sans-serif" font-size="7.2" font-weight="700" letter-spacing="1.35" fill="#AFC4D5">VECTOR HOLE</text>
  <text x="18" y="47" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#F5FAFF">NEON CORE</text>

  <g id="coin-balance">
    <rect x="264" y="18" width="76" height="40" rx="10" fill="#081A2A" stroke="#315A72" stroke-width="1"/>
    <g transform="translate(279,38)">
      <path d="M -7 0 L 0 -7 L 7 0 L 0 7 Z" fill="none" stroke="#EFCB63" stroke-width="1.4"/>
      <path d="M -3.2 0 L 0 -3.2 L 3.2 0 L 0 3.2 Z" fill="#EFCB63" opacity="0.85"/>
    </g>
    <text x="304" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#EFCB63" text-anchor="middle">195</text>
  </g>

  <g id="settings">
    <rect x="348" y="18" width="36" height="40" rx="10" fill="#081A2A" stroke="#315A72" stroke-width="1"/>
    <g transform="translate(366,38)" stroke="#AFC4D5" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="3.4"/>
      <line x1="0" y1="-9" x2="0" y2="-6.2"/><line x1="0" y1="9" x2="0" y2="6.2"/>
      <line x1="-9" y1="0" x2="-6.2" y2="0"/><line x1="9" y1="0" x2="6.2" y2="0"/>
      <line x1="-6.36" y1="-6.36" x2="-4.4" y2="-4.4"/><line x1="6.36" y1="6.36" x2="4.4" y2="4.4"/>
      <line x1="-6.36" y1="6.36" x2="-4.4" y2="4.4"/><line x1="6.36" y1="-6.36" x2="4.4" y2="-4.4"/>
      <circle r="7" opacity="0.5"/>
    </g>
  </g>
</g>

<!-- DISTRICT NAME + PROGRESS -->
<g id="district-header">
  <text x="18" y="98" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#F5FAFF">Plac Neonów</text>
  <text x="18" y="118" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.3" fill="#50F0FA">ODBUDOWA: 75% · 3 Z 4 MISJI</text>

  <rect x="18" y="128" width="364" height="5" rx="2.5" fill="#0B2434" stroke="#24475C" stroke-width="0.6"/>
  <rect x="18" y="128" width="273" height="5" rx="2.5" fill="#50F0FA"/>
</g>

<!-- MISSION LIST -->
<g id="mission-list">

  <g id="mission-m01" transform="translate(0,150)">
    <rect x="16" y="0" width="368" height="76" rx="12" fill="url(#panelGradient)" stroke="#24475C" stroke-width="0.9"/>
    <text x="32" y="24" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.3" fill="#819BB1">M01</text>
    <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F5FAFF">Pierwszy apetyt</text>
    <text x="32" y="61" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.3" fill="#46D99A">UKOŃCZONA · POWTÓRZ</text>
    <path d="M 350 32 L 355 38 L 366 24" stroke="#46D99A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="mission-m02" transform="translate(0,234)">
    <rect x="16" y="0" width="368" height="76" rx="12" fill="url(#panelGradient)" stroke="#24475C" stroke-width="0.9"/>
    <text x="32" y="24" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.3" fill="#819BB1">M02</text>
    <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F5FAFF">Dobra trasa</text>
    <text x="32" y="61" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.3" fill="#46D99A">UKOŃCZONA · POWTÓRZ</text>
    <path d="M 350 32 L 355 38 L 366 24" stroke="#46D99A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="mission-m03" transform="translate(0,318)">
    <rect x="16" y="0" width="368" height="76" rx="12" fill="url(#panelGradient)" stroke="#24475C" stroke-width="0.9"/>
    <text x="32" y="24" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.3" fill="#819BB1">M03</text>
    <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F5FAFF">Łańcuch reakcji</text>
    <text x="32" y="61" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.3" fill="#46D99A">UKOŃCZONA · POWTÓRZ</text>
    <path d="M 350 32 L 355 38 L 366 24" stroke="#46D99A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="mission-m04" transform="translate(0,402)">
    <rect x="16" y="0" width="368" height="76" rx="12" fill="url(#activeCardGradient)" stroke="#50F0FA" stroke-width="1.4"/>
    <rect x="16" y="0" width="368" height="76" rx="12" fill="none" stroke="#50F0FA" stroke-width="3" opacity="0.14" filter="url(#glowCyanSoft)"/>
    <text x="32" y="24" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" letter-spacing="0.3" fill="#68F5FC">M04</text>
    <text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F5FAFF">Pierwszy wielki kęs</text>
    <text x="32" y="61" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.3" fill="#50F0FA">DOSTĘPNA · GRAJ</text>
    <path d="M 350 26 L 350 46 L 366 36 Z" fill="#50F0FA"/>
  </g>
</g>

<!-- MEDALS -->
<g id="medals">
  <text x="18" y="504" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="400" fill="#819BB1">Medale: 0/4 · opcjonalne.</text>
  <text x="18" y="519" font-family="Arial, Helvetica, sans-serif" font-size="8.6" font-weight="400" fill="#819BB1">Nie blokują kolejnych misji.</text>
</g>

<!-- BOTTOM NAVIGATION -->
<g id="bottom-navigation">
  <rect x="16" y="696" width="368" height="74" rx="12" fill="#071827" stroke="#315A72" stroke-width="0.9"/>

  <g id="nav-city">
    <g transform="translate(62,720)" stroke="#839BAF" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -9 8 L -9 -2 L 0 -9 L 9 -2 L 9 8 Z"/>
      <line x1="-3" y1="8" x2="-3" y2="1"/><line x1="3" y1="8" x2="3" y2="1"/>
    </g>
    <text x="62" y="750" font-family="Arial, Helvetica, sans-serif" font-size="7.8" fill="#819BB1" text-anchor="middle">Miasto</text>
  </g>

  <g id="nav-districts">
    <g transform="translate(154,720)" stroke="#50F0FA" stroke-width="1.2" fill="none">
      <rect x="-8" y="-8" width="6.5" height="6.5" rx="1.3"/>
      <rect x="1.5" y="-8" width="6.5" height="6.5" rx="1.3"/>
      <rect x="-8" y="1.5" width="6.5" height="6.5" rx="1.3"/>
      <rect x="1.5" y="1.5" width="6.5" height="6.5" rx="1.3"/>
    </g>
    <text x="154" y="750" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#50F0FA" text-anchor="middle">Dzielnice</text>
    <rect x="140" y="760" width="28" height="3" rx="1.5" fill="#50F0FA"/>
  </g>

  <g id="nav-workshop">
    <g transform="translate(246,720)" stroke="#839BAF" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 -8 A 4 4 0 1 0 8 -4 L 3 1"/>
      <line x1="3" y1="1" x2="-8" y2="8"/>
      <circle cx="-8" cy="8" r="1.2" fill="#839BAF" stroke="none"/>
    </g>
    <text x="246" y="750" font-family="Arial, Helvetica, sans-serif" font-size="7.8" fill="#819BB1" text-anchor="middle">Warsztat</text>
  </g>

  <g id="nav-challenges">
    <g transform="translate(338,720)" stroke="#839BAF" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 -8 L 6 -8 L 6 -2 A 6 6 0 0 1 -6 -2 Z"/>
      <line x1="0" y1="4" x2="0" y2="7"/><line x1="-4" y1="7" x2="4" y2="7"/>
      <path d="M -6 -7 L -9 -7 L -9 -3 A 3 3 0 0 0 -6 0"/>
      <path d="M 6 -7 L 9 -7 L 9 -3 A 3 3 0 0 1 6 0"/>
    </g>
    <text x="338" y="750" font-family="Arial, Helvetica, sans-serif" font-size="7.8" fill="#819BB1" text-anchor="middle">Wyzwania</text>
    <circle cx="352" cy="710" r="3" fill="#0A1C2B" stroke="#839BAF" stroke-width="0.8"/>
    <path d="M 350.5 710 L 350.5 707 M 353.5 710 L 353.5 707 M 350 711.5 L 353.5 711.5" stroke="#839BAF" stroke-width="0.6"/>
  </g>
</g>

</svg>
