<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 800"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>
  <linearGradient id="bgGradient" x1="200" y1="0" x2="200" y2="800" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#04101D"/>
    <stop offset="100%" stop-color="#081C2B"/>
  </linearGradient>
  <linearGradient id="panelGradient" x1="200" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0A2032"/>
    <stop offset="100%" stop-color="#071725"/>
  </linearGradient>
  <linearGradient id="ctaGradient" x1="16" y1="0" x2="384" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#68F5FC"/>
    <stop offset="55%" stop-color="#50F0FA"/>
    <stop offset="100%" stop-color="#37DCEB"/>
  </linearGradient>
</defs>

<!-- BACKGROUND (dimmed gameplay stand-in) -->
<g id="gameplay-background" opacity="0.35">
  <rect x="0" y="0" width="400" height="800" fill="url(#bgGradient)"/>
  <circle cx="200" cy="300" r="90" fill="none" stroke="#2BCBDD" stroke-width="1"/>
  <circle cx="120" cy="480" r="14" fill="none" stroke="#50F0FA" stroke-width="1"/>
  <circle cx="290" cy="220" r="10" fill="none" stroke="#50F0FA" stroke-width="1"/>
</g>

<!-- DIM OVERLAY -->
<rect id="scrim" x="0" y="0" width="400" height="800" fill="#04101D" opacity="0.72"/>

<!-- PAUSE PANEL -->
<g id="pause-panel">
  <rect x="40" y="230" width="320" height="380" rx="16" fill="url(#panelGradient)" stroke="#315A72" stroke-width="1.1"/>

  <text x="200" y="278" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#F5FAFF" text-anchor="middle">PAUZA</text>
  <line x1="72" y1="296" x2="328" y2="296" stroke="#24475C" stroke-width="0.8"/>

  <!-- Wróć do gry (primary) -->
  <g id="btn-resume">
    <rect x="64" y="318" width="272" height="50" rx="10" fill="url(#ctaGradient)"/>
    <path d="M 96 336 L 96 350 L 108 343 Z" fill="#07131E"/>
    <text x="210" y="349" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#07131E" text-anchor="middle">WRÓĆ DO GRY</text>
  </g>

  <!-- Restart -->
  <g id="btn-restart">
    <rect x="64" y="382" width="272" height="50" rx="10" fill="#071827" stroke="#315A72" stroke-width="1"/>
    <g transform="translate(96,407)" stroke="#C6D5E3" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 -6 A 8 8 0 1 0 8 3"/>
      <path d="M 6 -9 L 6 -3 L 12 -4"/>
    </g>
    <text x="210" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F5FAFF" text-anchor="middle">RESTART MISJI / RUNDY</text>
  </g>

  <!-- Sterowanie -->
  <g id="btn-controls">
    <rect x="64" y="446" width="272" height="50" rx="10" fill="#071827" stroke="#315A72" stroke-width="1"/>
    <g transform="translate(96,471)" stroke="#C6D5E3" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-8" y="-6" width="16" height="12" rx="3"/>
      <circle cx="-3" cy="0" r="1.2" fill="#C6D5E3" stroke="none"/>
      <circle cx="3" cy="0" r="1.2" fill="#C6D5E3" stroke="none"/>
    </g>
    <text x="210" y="477" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F5FAFF" text-anchor="middle">STEROWANIE</text>
  </g>

  <!-- Wyjdź -->
  <g id="btn-exit">
    <rect x="64" y="510" width="272" height="50" rx="10" fill="#071827" stroke="#315A72" stroke-width="1"/>
    <g transform="translate(96,535)" stroke="#FF7A7A" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -2 -8 L -8 -8 L -8 8 L -2 8"/>
      <line x1="-6" y1="0" x2="9" y2="0"/>
      <path d="M 4 -5 L 9 0 L 4 5"/>
    </g>
    <text x="210" y="541" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#F5FAFF" text-anchor="middle">WYJDŹ DO MIASTA</text>
  </g>
</g>

</svg>
