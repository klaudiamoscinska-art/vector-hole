<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 400 800"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid meet"
  fill="none"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<defs>
  <linearGradient id="bgGradient" x1="200" y1="0" x2="200" y2="800" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#04101D"/>
    <stop offset="50%" stop-color="#061725"/>
    <stop offset="100%" stop-color="#081C2B"/>
  </linearGradient>
  <linearGradient id="panelGradient" x1="200" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0A2032"/>
    <stop offset="100%" stop-color="#071725"/>
  </linearGradient>
  <linearGradient id="heroGradient" x1="200" y1="76" x2="200" y2="330" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0B2A3C"/>
    <stop offset="100%" stop-color="#071A29"/>
  </linearGradient>
  <linearGradient id="ctaGradient" x1="16" y1="0" x2="384" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#68F5FC"/>
    <stop offset="55%" stop-color="#50F0FA"/>
    <stop offset="100%" stop-color="#37DCEB"/>
  </linearGradient>
  <filter id="glowCyanSoft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="0" y="0" width="400" height="800" fill="url(#bgGradient)"/>

<!-- HEADER -->
<g id="header">
  <text x="18" y="25" font-family="Arial, Helvetica, sans-serif" font-size="7.2" font-weight="700" letter-spacing="1.35" fill="#AFC4D5">VECTOR HOLE</text>
  <text x="18" y="47" font-family="Arial, Helvetica, sans-serif" font-size="25.5" font-weight="800" fill="#F5FAFF">WYZWANIA</text>

  <g id="coin-balance">
    <rect x="264" y="18" width="76" height="40" rx="10" fill="#081A2A" stroke="#315A72" stroke-width="1"/>
    <g transform="translate(279,38)">
      <path d="M -7 0 L 0 -7 L 7 0 L 0 7 Z" fill="none" stroke="#EFCB63" stroke-width="1.4"/>
      <path d="M -3.2 0 L 0 -3.2 L 3.2 0 L 0 3.2 Z" fill="#EFCB63" opacity="0.85"/>
    </g>
    <text x="304" y="42" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#EFCB63" text-anchor="middle">195</text>
  </g>

  <g id="settings">
    <rect x="348" y="18" width="36" height="40" rx="10" fill="#081A2A" stroke="#315A72" stroke-width="1"/>
    <g transform="translate(366,38)" stroke="#AFC4D5" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="3.4"/>
      <line x1="0" y1="-9" x2="0" y2="-6.2"/><line x1="0" y1="9" x2="0" y2="6.2"/>
      <line x1="-9" y1="0" x2="-6.2" y2="0"/><line x1="9" y1="0" x2="6.2" y2="0"/>
      <line x1="-6.36" y1="-6.36" x2="-4.4" y2="-4.4"/><line x1="6.36" y1="6.36" x2="4.4" y2="4.4"/>
      <line x1="-6.36" y1="6.36" x2="-4.4" y2="4.4"/><line x1="6.36" y1="-6.36" x2="4.4" y2="-4.4"/>
      <circle r="7" opacity="0.5"/>
    </g>
  </g>
</g>

<!-- DAILY HERO CARD -->
<g id="daily-hero">
  <rect x="16" y="76" width="368" height="254" rx="14" fill="url(#heroGradient)" stroke="#50F0FA" stroke-width="1.2"/>

  <g transform="translate(200,140)">
    <rect x="-16" y="-14" width="32" height="30" rx="4" fill="none" stroke="#50F0FA" stroke-width="1.6"/>
    <line x1="-8" y1="-19" x2="-8" y2="-11"/>
    <line x1="8" y1="-19" x2="8" y2="-11"/>
    <line x1="-16" y1="-4" x2="16" y2="-4"/>
    <path d="M 0 2 L 3 8 L 9.5 9 L 5 13.5 L 6.2 20 L 0 16.5 L -6.2 20 L -5 13.5 L -9.5 9 L -3 8 Z" fill="#50F0FA" opacity="0.15" filter="url(#glowCyanSoft)"/>
    <path d="M 0 2 L 3 8 L 9.5 9 L 5 13.5 L 6.2 20 L 0 16.5 L -6.2 20 L -5 13.5 L -9.5 9 L -3 8 Z" fill="#50F0FA"/>
  </g>

  <text x="200" y="185" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#F5FAFF" text-anchor="middle">WYZWANIE DNIA</text>
  <text x="200" y="200" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#9DB1C2" text-anchor="middle">Dzisiejszy twist: tylko fragmenty energii</text>
  <text x="200" y="212" font-family="Arial, Helvetica, sans-serif" font-size="8.2" fill="#9DB1C2" text-anchor="middle">+ szybsze combo</text>

  <!-- countdown -->
  <g id="countdown">
    <text x="200" y="234" font-family="Arial, Helvetica, sans-serif" font-size="7.4" font-weight="600" letter-spacing="0.3" fill="#819BB1" text-anchor="middle">RESETUJE SIĘ ZA</text>
    <text x="200" y="256" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#50F0FA" text-anchor="middle">04 : 32 : 18</text>
  </g>

  <!-- reward track -->
  <g id="reward-track">
    <rect x="40" y="272" width="150" height="42" rx="9" fill="#071827" stroke="#24475C" stroke-width="0.8"/>
    <text x="115" y="290" font-family="Arial, Helvetica, sans-serif" font-size="7.2" font-weight="700" fill="#C6D5E3" text-anchor="middle">PIERWSZE UKOŃCZENIE</text>
    <text x="115" y="304" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#50F0FA" text-anchor="middle">+20% Core City</text>

    <rect x="210" y="272" width="150" height="42" rx="9" fill="#071827" stroke="#24475C" stroke-width="0.8"/>
    <text x="285" y="290" font-family="Arial, Helvetica, sans-serif" font-size="7.2" font-weight="700" fill="#C6D5E3" text-anchor="middle">CEL PREMIUM / ZŁOTY</text>
    <text x="285" y="304" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" fill="#EFCB63" text-anchor="middle">+10% Core City</text>
  </g>
</g>

<!-- CTA -->
<g id="cta-play-daily">
  <rect x="16" y="346" width="368" height="48" rx="10" fill="url(#ctaGradient)"/>
  <text x="190" y="376" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="800" fill="#07131E" text-anchor="middle">ZAGRAJ WYZWANIE</text>
  <path d="M 340 361 L 340 379 L 354 370 Z" fill="#07131E"/>
</g>

<!-- STATUS INFO -->
<g id="status-info">
  <rect x="16" y="408" width="368" height="82" rx="11" fill="url(#panelGradient)" stroke="#315A72" stroke-width="0.9"/>
  <circle cx="42" cy="429" r="10" fill="none" stroke="#50F0FA" stroke-width="1.3"/>
  <circle cx="42" cy="425" r="1" fill="#50F0FA"/>
  <line x1="42" y1="428" x2="42" y2="434" stroke="#50F0FA" stroke-width="1.3" stroke-linecap="round"/>
  <text x="70" y="426" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#F5FAFF">Jak to działa?</text>

  <circle cx="74" cy="443" r="2.1" fill="#50F0FA"/>
  <text x="85" y="445" font-family="Arial, Helvetica, sans-serif" font-size="8.1" fill="#9DB1C2">Jedno Daily aktywne na dobę</text>
  <circle cx="74" cy="458" r="2.1" fill="#50F0FA"/>
  <text x="85" y="460" font-family="Arial, Helvetica, sans-serif" font-size="8.1" fill="#9DB1C2">Pierwsze ukończenie daje największy bonus</text>
  <circle cx="74" cy="473" r="2.1" fill="#50F0FA"/>
  <text x="85" y="475" font-family="Arial, Helvetica, sans-serif" font-size="8.1" fill="#9DB1C2">Nagrody trafiają do Warsztatu</text>
</g>

<!-- BOTTOM NAVIGATION -->
<g id="bottom-navigation">
  <rect x="16" y="696" width="368" height="74" rx="12" fill="#071827" stroke="#315A72" stroke-width="0.9"/>

  <g id="nav-city">
    <g transform="translate(62,720)" stroke="#839BAF" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -9 8 L -9 -2 L 0 -9 L 9 -2 L 9 8 Z"/>
      <line x1="-3" y1="8" x2="-3" y2="1"/><line x1="3" y1="8" x2="3" y2="1"/>
    </g>
    <text x="62" y="750" font-family="Arial, Helvetica, sans-serif" font-size="7.8" fill="#819BB1" text-anchor="middle">Miasto</text>
  </g>

  <g id="nav-districts">
    <g transform="translate(154,720)" stroke="#839BAF" stroke-width="1.2" fill="none">
      <rect x="-8" y="-8" width="6.5" height="6.5" rx="1.3"/>
      <rect x="1.5" y="-8" width="6.5" height="6.5" rx="1.3"/>
      <rect x="-8" y="1.5" width="6.5" height="6.5" rx="1.3"/>
      <rect x="1.5" y="1.5" width="6.5" height="6.5" rx="1.3"/>
    </g>
    <text x="154" y="750" font-family="Arial, Helvetica, sans-serif" font-size="7.8" fill="#819BB1" text-anchor="middle">Dzielnice</text>
  </g>

  <g id="nav-workshop">
    <g transform="translate(246,720)" stroke="#839BAF" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 -8 A 4 4 0 1 0 8 -4 L 3 1"/>
      <line x1="3" y1="1" x2="-8" y2="8"/>
      <circle cx="-8" cy="8" r="1.2" fill="#839BAF" stroke="none"/>
    </g>
    <text x="246" y="750" font-family="Arial, Helvetica, sans-serif" font-size="7.8" fill="#819BB1" text-anchor="middle">Warsztat</text>
  </g>

  <g id="nav-challenges">
    <g transform="translate(338,720)" stroke="#50F0FA" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 -8 L 6 -8 L 6 -2 A 6 6 0 0 1 -6 -2 Z"/>
      <line x1="0" y1="4" x2="0" y2="7"/><line x1="-4" y1="7" x2="4" y2="7"/>
      <path d="M -6 -7 L -9 -7 L -9 -3 A 3 3 0 0 0 -6 0"/>
      <path d="M 6 -7 L 9 -7 L 9 -3 A 3 3 0 0 1 6 0"/>
    </g>
    <text x="338" y="750" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="700" fill="#50F0FA" text-anchor="middle">Wyzwania</text>
    <rect x="322" y="760" width="32" height="3" rx="1.5" fill="#50F0FA"/>
  </g>
</g>

</svg>
